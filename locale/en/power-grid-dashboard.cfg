[mod-name]
power-grid-dashboard=Power Grid Dashboard

[mod-description]
power-grid-dashboard=One window with every electric network on every planet and platform: satisfaction, usage against capacity, accumulator charge and time left, the lowest satisfaction of the last five minutes, and real alerts for brownouts and draining accumulators. Rename networks, jump to them or pin them.

[shortcut-name]
power-grid-dashboard=Power grid dashboard

[controls]
power-grid-dashboard-toggle=Toggle power grid dashboard

[mod-setting-name]
power-grid-dashboard-alert-threshold=Brownout alert below satisfaction (%)
power-grid-dashboard-alert-delay=Brownout alert after (seconds)
power-grid-dashboard-accumulator-warning=Accumulator alert when empty within (seconds)
power-grid-dashboard-minimum-poles=Minimum network size (poles)
power-grid-dashboard-census-budget=Poles checked per tick

[mod-setting-description]
power-grid-dashboard-alert-threshold=A network whose consumers get less than this share of the power they need is in a brownout. 100 alerts on any shortage at all.
power-grid-dashboard-alert-delay=The brownout has to last this long before the alert appears, so short dips are ignored.
power-grid-dashboard-accumulator-warning=Raise an alert when draining accumulators will be empty within this time. 0 turns the alert off.
power-grid-dashboard-minimum-poles=Smaller networks get no alerts and are hidden in the dashboard unless "Show small networks" is ticked.
power-grid-dashboard-census-budget=The dashboard finds networks by checking every electric pole in the background, this many per tick. Higher values notice new networks sooner, lower values cost less time on huge maps.

